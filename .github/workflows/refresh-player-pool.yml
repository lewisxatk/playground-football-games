name: Refresh player pool
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/build-player-pool.py"
      - ".github/workflows/refresh-player-pool.yml"

permissions:
  contents: write

concurrency:
  group: player-pool-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the Parquet query engine
        run: python -m pip install --disable-pip-version-check duckdb==1.4.3

      - name: Resolve the latest upstream data release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/florentfougeres/OpenFootballBase-Data/releases/latest \
            -o "$RUNNER_TEMP/release.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d=json.load(open(os.environ["RUNNER_TEMP"]+"/release.json"))
          asset=next((a for a in d.get("assets",[]) if a["name"]=="openfootballbase-data.tar.gz"),None)
          if not asset:
              raise SystemExit("Upstream release has no openfootballbase-data.tar.gz asset")
          print("tag="+d["tag_name"])
          print("url="+asset["browser_download_url"])
          print("size="+str(asset["size"]))
          PY

      - name: Download the source archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_URL: ${{ steps.upstream.outputs.url }}
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$ARCHIVE_URL" \
            -o "$RUNNER_TEMP/openfootballbase-data.tar.gz"
          ls -lh "$RUNNER_TEMP/openfootballbase-data.tar.gz"

      - name: Build compact player shards
        run: |
          python scripts/build-player-pool.py \
            --archive "$RUNNER_TEMP/openfootballbase-data.tar.gz" \
            --out public/data/player-pool \
            --release-tag "${{ steps.upstream.outputs.tag }}"

      - name: Validate the site and generated data
        run: |
          npm install
          npm run validate:data
          npm run build

      - name: Commit refreshed player shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/player-pool
          if git diff --cached --quiet; then
            echo "Player shards are already current."
          else
            git commit -m "Refresh static player pool from ${{ steps.upstream.outputs.tag }}"
            git push
          fi
