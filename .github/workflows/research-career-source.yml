name: Research Career File source schema

on:
  push:
    branches: [fix/career-file-tier-pool-v2]
    paths:
      - scripts/inspect-career-source.mjs
      - .github/workflows/research-career-source.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/inspect-career-source.mjs
      - .github/workflows/research-career-source.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect published Quiz FC dataset schema
        run: node scripts/inspect-career-source.mjs

# Research-only workflow; this does not feed production data.
# Schema audit includes the public Career Path bundle's data-field mapping.
# This is a research-only fetch, not a production dependency.
# Candidate-count audit compares strict and expanded pools by fame tier.
