name: Generate compact player shards

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_player_shards.py"
      - ".github/workflows/generate-player-shards.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playground-player-shard-refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.4.3

      - name: Build and validate compact player shards
        run: |
          python scripts/build_player_shards.py --output public/data/player-shards --shard-size 1000
          npm install
          npm run validate:data
          npm run build

      - name: Commit updated shard set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/player-shards
          if git diff --cached --quiet; then
            echo "The latest upstream release produces no player shard changes."
          else
            git commit -m "Refresh compact football player shards from upstream release"
            git push origin HEAD:main
          fi
