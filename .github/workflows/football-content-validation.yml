name: Football content validation

on:
  push:
    branches:
      - feat/cult-hero-mystery-pack-opening
  pull_request:
    branches:
      - main

jobs:
  validate-football-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate football question bank
        run: node scripts/validate-football-content.mjs
