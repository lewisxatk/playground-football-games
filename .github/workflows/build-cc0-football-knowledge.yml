name: Build CC0 football knowledge database

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cult-hero-mystery-pack-opening
    paths:
      - "scripts/build-cc0-football-knowledge.mjs"
      - ".github/workflows/build-cc0-football-knowledge.yml"
      - "public/data/worldcup-lineups.json"
      - "src/footballKnowledge.ts"
      - "src/ArcadeApp.tsx"
      - "src/CC0CareerFilePage.tsx"
      - "src/CultHeroPage.tsx"

permissions:
  contents: write

concurrency:
  group: cc0-football-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PLAYGROUND
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check out pinned CC0 player data
        uses: actions/checkout@v4
        with:
          repository: openfootball/players
          ref: 125d20f7cc06cac7e758b40df535a7695632680a
          path: .sources/openfootball-players
      - name: Check out pinned CC0 club data
        uses: actions/checkout@v4
        with:
          repository: openfootball/clubs
          ref: ae3800227c449447b3a337fc0aac79a8f02f4c8b
          path: .sources/openfootball-clubs
      - name: Check out pinned CC0 international results
        uses: actions/checkout@v4
        with:
          repository: martj42/international_results
          ref: ca84241bb3eed854a1956a2fab442fe4daad40dd
          path: .sources/international-results
      - name: Check out pinned CC0 UEFA club results
        uses: actions/checkout@v4
        with:
          repository: openfootball/champions-league
          ref: abfaeddc2ee3d14f99ecc163c9ddb46cb4d67cef
          path: .sources/openfootball-champions-league
      - name: Check out pinned CC0 England domestic data
        uses: actions/checkout@v4
        with:
          repository: openfootball/england
          ref: 9ee7a0c351805c99cc334478a9bf04b7d0432fec
          path: .sources/openfootball-england
      - name: Check out pinned CC0 World Cup source
        uses: actions/checkout@v4
        with:
          repository: openfootball/worldcup.json
          ref: 516d3825c3bd23fdc298c4014e84bde78f2d4965
          path: .sources/openfootball-worldcup
      - name: Verify upstream licences
        shell: bash
        run: |
          grep -q "CC0 1.0 Universal" .sources/openfootball-players/LICENSE.md
          grep -q "CC0 1.0 Universal" .sources/openfootball-clubs/LICENSE.md
          grep -q "CC0 1.0 Universal" .sources/international-results/LICENSE
          grep -q "CC0 1.0 Universal" .sources/openfootball-worldcup/LICENSE.md
          grep -q "CC0 1.0 Universal" .sources/openfootball-england/LICENSE.md
          grep -q "CC0 1.0 Universal" .sources/openfootball-champions-league/LICENSE.md
      - name: Build canonical database and game pools
        run: node scripts/build-cc0-football-knowledge.mjs
      - name: Install dependencies and verify full site build
        run: npm install && npm run build
      - name: Publish generated database to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/
          if git diff --cached --quiet; then echo "Database already current."; exit 0; fi
          git commit -m "Build pinned CC0 football knowledge database"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-knowledge-build-report
          path: |
            public/data/football-knowledge-report.json
            public/data/football-knowledge-manifest.cc0.json
          if-no-files-found: ignore
          retention-days: 30
